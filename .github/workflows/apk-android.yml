# Monta o APK da Solve Central na nuvem — não é preciso Android Studio na máquina.
#
# Rode em Actions → "APK Android (Solve Central)" → Run workflow.
# O APK sai em "Artifacts", no fim da execução.
#
# Secrets necessários (Settings → Secrets and variables → Actions):
#   VITE_SUPABASE_URL        URL do projeto Supabase
#   VITE_SUPABASE_ANON_KEY   anon/publishable key (nunca a service_role)
# Opcionais — só para gerar APK assinado de verdade (mesma chave sempre,
# obrigatória se um dia for para a Play Store):
#   ANDROID_KEYSTORE_BASE64  o arquivo .jks em base64
#   ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD

name: APK Android (Solve Central)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'          # compileSdk 36 exige JDK 21

      - uses: android-actions/setup-android@v3

      - name: Instalar dependências
        run: npm ci

      - name: Gravar chaves do Supabase
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" > .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env

      - name: Build do site + sync com o projeto Android
        run: npx vite build && npx cap sync android

      - name: Preparar assinatura (se a chave estiver nos secrets)
        id: assinatura
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/solve.jks
          cat > android/keystore.properties <<EOF
          storeFile=solve.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
          echo "assinado=sim" >> "$GITHUB_OUTPUT"

      - name: Montar APK assinado
        if: steps.assinatura.outputs.assinado == 'sim'
        run: chmod +x android/gradlew && cd android && ./gradlew assembleRelease

      - name: Montar APK de teste (sem chave própria)
        if: steps.assinatura.outputs.assinado != 'sim'
        run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug

      - name: Publicar o APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: solve-central-apk
          path: admin/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Apagar a chave de assinatura do runner
        if: always()
        run: rm -f android/solve.jks android/keystore.properties
